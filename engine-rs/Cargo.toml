[package]
name = "hindcast-engine"
version = "0.1.0"
edition = "2021"
description = "Hindcast's replay engine: real traffic through a calibrated model, bucket by bucket"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
serde-wasm-bindgen = "0.6"
js-sys = "=0.3.77"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
