[package]
name = "hindcast-engine"
version = "0.1.0"
edition = "2021"
description = "Hindcast's replay engine: real traffic through a calibrated model, bucket by bucket"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex-lite = "0.1"
libm = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
serde_norway = "0.9"
ureq = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
serde-wasm-bindgen = "0.6"
js-sys = "=0.3.77"
dlmalloc = "0.2"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
