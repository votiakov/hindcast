events { worker_connections 8192; }
http {
  access_log off;
  # re-resolve "frontend" every 2 s so scaled-out replicas join the rotation
  resolver 127.0.0.11 valid=2s ipv6=off;
  server {
    listen 8080;
    location / {
      set $frontend http://frontend:8080;
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }
  }
}
