# Reference system 2: Google Online Boutique (github.com/GoogleCloudPlatform/microservices-demo),
# 11 services in Go, Node.js, Python, C# and Java talking gRPC, each in a CPU-limited container.
# CPU-bound: the frontend renders every page and fans out to currency/catalog/recommendations.
# nginx in front of the frontend lets the frontend scale out (FRONTEND_REPLICAS, or the autoscaler).
name: boutique
x-env: &trace
  ENABLE_TRACING: "1"
  DISABLE_PROFILER: "1"
  ENABLE_PROFILER: "0"
  COLLECTOR_SERVICE_ADDR: otel-collector:4317
services:
  frontend-lb:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    cpus: 0.5
    mem_limit: 64m
    networks: [ref]
  frontend:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.2
    environment:
      <<: *trace
      PORT: "8080"
      OTEL_SERVICE_NAME: frontend
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      SHOPPING_ASSISTANT_SERVICE_ADDR: shoppingassistantservice:80
    cpus: 0.5
    mem_limit: 256m
    deploy: { replicas: "${FRONTEND_REPLICAS:-1}" }
    networks: [ref]
  productcatalogservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.2
    environment: { <<: *trace, PORT: "3550", OTEL_SERVICE_NAME: productcatalogservice }
    cpus: 0.25
    mem_limit: 128m
    networks: [ref]
  currencyservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/currencyservice:v0.10.2
    environment: { <<: *trace, PORT: "7000", OTEL_SERVICE_NAME: currencyservice }
    cpus: 0.25
    mem_limit: 192m
    networks: [ref]
  cartservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/cartservice:v0.10.2
    environment: { REDIS_ADDR: "redis-cart:6379", OTEL_SERVICE_NAME: cartservice }
    cpus: 0.25
    mem_limit: 192m
    networks: [ref]
  redis-cart:
    image: redis:7-alpine
    cpus: 0.25
    mem_limit: 128m
    networks: [ref]
  recommendationservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.2
    environment: { <<: *trace, PORT: "8080", PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550", OTEL_SERVICE_NAME: recommendationservice }
    cpus: 0.25
    mem_limit: 256m
    networks: [ref]
  shippingservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/shippingservice:v0.10.2
    environment: { <<: *trace, PORT: "50051", OTEL_SERVICE_NAME: shippingservice }
    cpus: 0.15
    mem_limit: 128m
    networks: [ref]
  checkoutservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/checkoutservice:v0.10.2
    environment:
      <<: *trace
      PORT: "5050"
      OTEL_SERVICE_NAME: checkoutservice
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
    cpus: 0.25
    mem_limit: 128m
    networks: [ref]
  paymentservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice:v0.10.2
    environment: { <<: *trace, PORT: "50051", OTEL_SERVICE_NAME: paymentservice }
    cpus: 0.15
    mem_limit: 128m
    networks: [ref]
  emailservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.2
    environment: { <<: *trace, PORT: "8080", OTEL_SERVICE_NAME: emailservice }
    cpus: 0.15
    mem_limit: 192m
    networks: [ref]
  adservice:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/adservice:v0.10.2
    environment: { <<: *trace, PORT: "9555", OTEL_SERVICE_NAME: adservice }
    cpus: 0.5
    mem_limit: 384m
    networks: [ref]
networks:
  ref:
    name: bnref
    external: true
