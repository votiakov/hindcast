events { worker_connections 8192; }
http {
  access_log off;
  # re-resolve "app" every 2 s so scaled-out replicas join the rotation
  resolver 127.0.0.11 valid=2s ipv6=off;
  server {
    listen 9966;
    location / {
      set $app http://app:9966;
      proxy_pass $app;
      proxy_http_version 1.1;
      proxy_read_timeout 120s;
    }
  }
}
