# Reference system 3 — Spring PetClinic REST (github.com/spring-petclinic/spring-petclinic-rest) on
# PostgreSQL 16, traced by the OpenTelemetry Java agent. A JVM app with a 10-connection Hikari pool
# in front of a CPU-limited database.
name: PetClinic
project: petclinic
base: http://app-lb:9966
timeout: 5s
warmupS: 200
thin: 10
mix: mix.json
edge: app-lb
slo: { p99Ms: 500, errorRate: 0.01 }
runs:
  # quick capacity probe (not used for calibration)
  probe: { shape: [steps, 5, 125, 10, 30] }
