# Tempo in single-binary mode for the reference stack: the same sampled traces as Jaeger, so the
# agent's Tempo path (agent/sources.ts) is tested against the real API.
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
