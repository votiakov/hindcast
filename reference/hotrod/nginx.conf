events { worker_connections 4096; }
http {
  access_log off;
  # re-resolve "customer" every few seconds so scaled-out replicas join the rotation
  resolver 127.0.0.11 valid=2s ipv6=off;
  server {
    listen 8081;
    location / {
      set $customer http://customer:8081;
      proxy_pass $customer;
      proxy_http_version 1.1;
      proxy_read_timeout 120s;
    }
  }
}
