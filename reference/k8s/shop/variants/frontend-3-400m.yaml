apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: shop
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 2s
      probabilistic_sampler:
        sampling_percentage: 10
    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets:
              - 2ms
              - 5ms
              - 10ms
              - 20ms
              - 30ms
              - 50ms
              - 75ms
              - 100ms
              - 150ms
              - 200ms
              - 300ms
              - 400ms
              - 500ms
              - 750ms
              - 1s
              - 1500ms
              - 2s
              - 3s
              - 5s
              - 10s
              - 30s
        dimensions:
          - name: http.route
          - name: http.method
          - name: server.address
          - name: peer.service
          - name: net.peer.name
        metrics_flush_interval: 5s
      servicegraph:
        latency_histogram_buckets:
          - 2ms
          - 5ms
          - 10ms
          - 20ms
          - 30ms
          - 50ms
          - 75ms
          - 100ms
          - 150ms
          - 200ms
          - 300ms
          - 400ms
          - 500ms
          - 750ms
          - 1s
          - 1500ms
          - 2s
          - 3s
          - 5s
          - 10s
          - 30s
        store:
          ttl: 10s
          max_items: 20000
        metrics_flush_interval: 15s
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      nop: {}
    service:
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - spanmetrics
            - servicegraph
        traces/sampled:
          receivers:
            - otlp
          processors:
            - probabilistic_sampler
            - batch
          exporters:
            - otlp/jaeger
        metrics:
          receivers:
            - spanmetrics
            - servicegraph
          exporters:
            - prometheus
        metrics/apps:
          receivers:
            - otlp
          exporters:
            - nop
        logs:
          receivers:
            - otlp
          exporters:
            - nop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: shop
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8889
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 1Gi
          args:
            - --config=/conf/config.yaml
          volumeMounts:
            - name: conf
              mountPath: /conf
      volumes:
        - name: conf
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: shop
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8889
      targetPort: 8889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: shop
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: query
              containerPort: 16686
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          env:
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_KEY
              value: /badger/key
            - name: BADGER_DIRECTORY_VALUE
              value: /badger/data
            - name: BADGER_SPAN_STORE_TTL
              value: 168h
            - name: QUERY_BASE_PATH
              value: /jaeger
          volumeMounts:
            - name: badger
              mountPath: /badger
      volumes:
        - name: badger
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: shop
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: query
      port: 16686
      targetPort: 16686
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: shop
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: shop
spec:
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
    - port: metrics
      interval: 15s
