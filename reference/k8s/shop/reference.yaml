# Kubernetes reference — the OpenTelemetry Astronomy Shop on a local kind cluster (reference/k8s),
# observed the way production clusters are: kube-prometheus-stack (kubelet/cAdvisor,
# kube-state-metrics), span metrics from an OpenTelemetry Collector, traces in Jaeger, ingress-nginx
# at the edge. Traffic is real: two days of NASA's web server log (July 1995), replayed at 83× their
# real rate with each day compressed into 40 minutes. 12 July is an ordinary day; 13 July is the
# launch of Space Shuttle STS-70, a real flash crowd 2.2× the ordinary day's peak.
name: Astronomy Shop on Kubernetes
namespace: shop
base: http://bnk8s-control-plane
prometheus: http://localhost:8088/prometheus
jaeger: http://localhost:8088/jaeger
mix: ../../shop/mix.json
thin: 5
timeout: 5s
slo: { p99Ms: 1000, errorRate: 0.01 }
# 3 minutes stepping 40 → 200 req/s: the JIT and caches warm before recording
warmup: [steps, 40, 200, 40, 36]
log: ../nasa/NASA_access_log_Jul95.gz
runs:
  # the history the model is calibrated on: an ordinary day, as built (3 frontend replicas)
  history: { day: 12/Jul/1995, minutes: 40, scale: x83, manifests: shop.yaml }
  # the system as built on launch day: the forecast with no change at all
  launch: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: shop.yaml }
  # change 1, actually applied — 2 frontend replicas — on an ordinary day, and on launch day
  normal-2: { day: 12/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-2.yaml }
  launch-2: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-2.yaml }
  # change 2, actually applied — 1 frontend replica — on an ordinary day
  normal-1: { day: 12/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-1.yaml }
  # change 3, actually applied — a HorizontalPodAutoscaler (1–3 replicas at 60% CPU) — on launch day
  launch-hpa: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-hpa.yaml }
  # out of sample: added after the CFS throttling model was designed on the five runs above; the
  # backtest's verdicts were written to validation/predictions-oos.json before these ran
  launch-2c: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-2-1cpu.yaml }
  normal-1c: { day: 12/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-1-1cpu.yaml }
  normal-1-750: { day: 12/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-1-750m.yaml }
  launch-x1.3: { day: 13/Jul/1995, minutes: 40, scale: x108, manifests: shop.yaml }
  # out of sample, second round: predicted (validation/predictions-oos-2.json) before these ran
  launch-x1.3-4: { day: 13/Jul/1995, minutes: 40, scale: x108, manifests: variants/frontend-4.yaml }
  launch-x1.3-hpa: { day: 13/Jul/1995, minutes: 40, scale: x108, manifests: variants/frontend-hpa-2-5.yaml }
  launch-2-750: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-2-750m.yaml }
  # out of sample, third round: the leak read from the ordinary day — when email is OOM-killed on an
  # ordinary day at 1.5× traffic, and whether doubling its memory keeps it alive on launch day
  # (predicted in validation/predictions-oos-3.json before these ran)
  normal-x1.5: { day: 12/Jul/1995, minutes: 40, scale: x125, manifests: shop.yaml }
  launch-email300: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/email-300mi.yaml }
  # out of sample, fourth round: three changes away from the frontend, in .NET, Python and Go
  # (predicted in validation/predictions-oos-4.json before these ran)
  launch-cart250: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/cart-250m.yaml }
  launch-rec2: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/recommendation-2.yaml }
  normal-catalog125: { day: 12/Jul/1995, minutes: 40, scale: x83, manifests: variants/product-catalog-125m.yaml }
  # the as-built launch day recorded a second time, nothing changed: how far two recordings of the
  # same day differ (the email leak's kill lands in one bucket or four), the noise under the
  # half-minute gate. Not a question, not scored
  launch-b: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: shop.yaml }
  # out of sample, fifth round: scored against both recordings of the as-built launch day
  # (predicted in validation/predictions-oos-5.json before these ran)
  launch-catalog125: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/product-catalog-125m.yaml }
  launch-checkout125: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/checkout-125m.yaml }
  launch-3-400: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/frontend-3-400m.yaml }
  # out of sample, sixth round: stacked on email at 300 MiB (the leak can't stall checkout), judged
  # against two recordings of that baseline, launch-email300 and launch-e300-b (predicted in
  # validation/predictions-oos-6.json before any of these ran)
  launch-e300-b: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/email-300mi.yaml }
  launch-e300-2: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/e300-frontend-2.yaml }
  launch-e300-3-400: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/e300-frontend-3-400m.yaml }
  launch-e300-catalog125: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/e300-catalog-125m.yaml }
  # round 7: the ordinary day recorded again on 18 October, as built, to recalibrate after the drift
  # round 6 found (frontend and product-catalog cheaper per request than on 13 October). A third
  # model, "fresh", is calibrated on it alone; round 7's verdicts are that model's, committed in
  # validation/predictions-oos-7.json before any of round 7's change runs is recorded
  history-b: { day: 12/Jul/1995, minutes: 40, scale: x83, manifests: shop.yaml }
  launch-r7-2: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/e300-frontend-2.yaml }
  launch-r7-3-400: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/e300-frontend-3-400m.yaml }
  launch-r7-catalog125: { day: 13/Jul/1995, minutes: 40, scale: x83, manifests: variants/e300-catalog-125m.yaml }
  # a node failure for real: bnk8s-worker's container stops a minute before the ordinary day's
  # busiest moment (as built). check_node_loss predicts it from the placement at that instant
  normal-nodeloss: { day: 12/Jul/1995, minutes: 40, scale: x83, manifests: shop.yaml, kill: { node: bnk8s-worker, atS: 1160 } }
  # a 4-minute check that the recorder works end to end (not used for accuracy)
  smoke: { day: 13/Jul/1995, minutes: 4, scale: x83, manifests: shop.yaml }
  # a 12-minute step load test as built (+50 req/s a minute from 50 to 600): the kind of load test a
  # team runs before a launch. Calibrating on history + this run is the second model the evaluation scores
  stress: { steps: [50, 600, 50, 60], manifests: shop.yaml }
