# HotROD as deployed — the same footprint as the recorded reference system.
# Change replicas, CPU/memory limits, add an HPA or an arm64 nodeSelector in a pull request
# and the Bottleneck check backtests the change against recorded production traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: jaegertracing/example-hotrod:latest
          args: ["frontend", "-D", "100ms", "-W", "20"]
          resources:
            limits: { cpu: "1", memory: 256Mi }
---
