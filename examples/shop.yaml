# A typical web shop: one LB, a stateless API fleet, one Postgres.
version: 1
name: Web shop
components:
  - { id: users, kind: client }
  - { id: lb, kind: lb }
  - { id: api, kind: server, instances: 4, runtime: node }
  - { id: db, kind: db, tier: M }
connections:
  - [users, lb]
  - [lb, api]
  - [api, db]
